services:
  - type: web
    name: gemmy-api
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OLLAMA_BASE_URL
        value: https://your-ollama-service.example.com/api
      - key: OLLAMA_MODEL
        value: qwen3:8b
      - key: OLLAMA_EMBED_MODEL
        value: embeddinggemma
      - key: CHROMA_PATH
        value: /data/chroma
      - key: RAG_TOP_K
        value: "5"
    disk:
      name: gemmy-data
      mountPath: /data
      sizeGB: 10
